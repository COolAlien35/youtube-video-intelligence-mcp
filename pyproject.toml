[project]
name = "yt-intel"
version = "0.1.0"
description = "YouTube Video Intelligence MCP – analyse YouTube content through a Model Context Protocol server."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "anyio>=4.6",
    "fastapi>=0.115",
    "mcp==2.3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_intel"]

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pre-commit>=4",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "N", "C4", "SIM", "TCH", "RUF"]
ignore = ["S101"]                       # allow assert in tests (per-path below)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                   # assert is fine in tests
"scripts/**" = ["S603", "S607"]         # subprocess calls OK in helper scripts

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["yt_intel"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -v"
asyncio_mode = "auto"
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (may touch network or DB)",
    "e2e: end-to-end tests",
    "security: security-related tests",
]
