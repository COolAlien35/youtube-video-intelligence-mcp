# ── CI Pipeline ──────────────────────────────────────────────────────────────
# Job IDs and name: fields are identical so branch-protection check names
# are stable. No YouTube API calls; no repo secrets referenced.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Top-level least-privilege (TQ-28)
permissions:
  contents: read

# Cancel superseded PR runs only; every push to main gets a full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ── Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: mypy
        run: uv run mypy src scripts

  # ── Test (Linux) ──────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: pytest with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Write coverage to job summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          uv run python -c "
          import xml.etree.ElementTree as ET, sys
          try:
              tree = ET.parse('coverage.xml')
              rate = float(tree.getroot().get('line-rate', 0)) * 100
              print(f'Overall line coverage: **{rate:.1f}%**', file=open('/dev/stderr', 'w'))
              print(f'| Metric | Value |', flush=True)
              print(f'|--------|-------|', flush=True)
              print(f'| Line coverage | {rate:.1f}% |', flush=True)
          except Exception as e:
              print(f'Could not parse coverage.xml: {e}', file=sys.stderr)
          " >> \$GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage report unavailable" >> \$GITHUB_STEP_SUMMARY

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ── Test (Windows) ────────────────────────────────────────────────────────
  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: pytest
        run: uv run pytest

  # ── Secret scan ───────────────────────────────────────────────────────────
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if .env or private keys are tracked
        run: |
          bad=$(git ls-files | grep -E '(^\.env$|\.(pem|key|p12|pfx)$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret or key files found:"
            echo "$bad"
            exit 1
          fi

  # ── RTM check ─────────────────────────────────────────────────────────────
  rtm-check:
    name: rtm-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Validate RTM (skips until scripts/validate_traceability.py exists)
        run: |
          if [ -f scripts/validate_traceability.py ]; then
            uv run python scripts/validate_traceability.py
          elif [ -f docs/rtm/requirements_rtm.csv ]; then
            echo "::error::RTM CSV exists but validator script is missing"
            exit 1
          else
            echo "RTM validator not present yet — skipping"
          fi

  # ── PR title (Conventional Commits) ───────────────────────────────────────
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            style
          requireScope: false
