# ── Shared setup for CI jobs ──────────────────────────────────────────────────
# Installs the pinned uv version, restores the uv cache, and runs uv sync.
# Used by every job so they can't drift apart.
# ─────────────────────────────────────────────────────────────────────────────
name: "Setup project"
description: "Install uv, restore cache, and sync dependencies"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.32"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      shell: bash
      run: uv sync --locked
